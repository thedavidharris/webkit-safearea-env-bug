<!doctype html>
<html>
	<head>
		<meta
			name="viewport"
			content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
		/>
		<style>
			:root {
				--inset-top: var(--native-safe-area-inset-top, env(safe-area-inset-top, 0px));
				--inset-right: var(--native-safe-area-inset-right, env(safe-area-inset-right, 0px));
				--inset-bottom: var(--native-safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
				--inset-left: var(--native-safe-area-inset-left, env(safe-area-inset-left, 0px));
				font: 16px -apple-system, sans-serif;
			}
			html,
			body {
				margin: 0;
				padding: 0;
			}
			/* Starts at y=0 behind the nav bar; only its text respects the inset. */
			.hero {
				position: relative;
				box-sizing: border-box;
				height: calc(var(--inset-top) + 260px);
				padding: var(--inset-top) calc(var(--inset-right) + 16px) 16px calc(var(--inset-left) + 16px);
				background: linear-gradient(160deg, #1d3cff, #b14fff 60%, #ff7a59);
				color: white;
				display: flex;
				flex-direction: column;
				justify-content: space-between;
			}
			/* Should sit flush with the bottom of the nav bar. */
			.hero::before {
				content: "";
				position: absolute;
				left: 0;
				right: 0;
				top: var(--inset-top);
				border-top: 2px dashed rgb(255 255 255 / 0.8);
			}
			.hero-kicker {
				padding-top: 8px;
				font-size: 13px;
				text-transform: uppercase;
				letter-spacing: 0.08em;
			}
			.hero-title {
				font-size: 32px;
				font-weight: 700;
			}
			main {
				padding-left: var(--inset-left);
				padding-right: var(--inset-right);
				padding-bottom: calc(var(--inset-bottom) + 140px);
			}
			.row {
				height: 64px;
				display: flex;
				align-items: center;
				padding: 0 16px;
			}
			.row:nth-child(odd) {
				background: hsl(210 60% 96%);
			}
			#diagnostics {
				position: fixed;
				left: 0;
				right: 0;
				bottom: 0;
				padding: 8px calc(var(--inset-right) + 12px) calc(var(--inset-bottom) + 8px) calc(var(--inset-left) + 12px);
				background: rgb(0 0 0 / 0.78);
				color: white;
				font: 11px ui-monospace, monospace;
				white-space: pre-wrap;
                overflow-wrap: anywhere;
                max-height: 35vh;
                overflow: auto;
				-webkit-backdrop-filter: blur(12px);
			}
		</style>
        <script>
            // Earliest page probe: after viewport/style parsing, before body content.
            // This is a script checkpoint, not a guarantee about first paint.
            const edges = ["top", "right", "bottom", "left"];
            const documentID = window.__nativeSafeAreaBridge?.documentID ?? globalThis.crypto?.randomUUID?.() ?? `${Date.now()}-${Math.random()}`;
            const snapshots = [];
            function readInsets(expression) {
                const probe = document.createElement("div");
                probe.style.cssText = "position:fixed;visibility:hidden;pointer-events:none";
                for (const edge of edges) probe.style.setProperty(`padding-${edge}`, expression(edge));
                document.documentElement.appendChild(probe);
                const style = getComputedStyle(probe);
                const result = Object.fromEntries(edges.map(edge => [edge, parseFloat(style.getPropertyValue(`padding-${edge}`))]));
                probe.remove();
                return result;
            }
            function measure() {
                const style = getComputedStyle(document.documentElement);
                const native = Object.fromEntries(edges.map(edge => {
                    const value = style.getPropertyValue(`--native-safe-area-inset-${edge}`).trim();
                    return [edge, value ? parseFloat(value) : null];
                }));
                return {
                    env: readInsets(edge => `env(safe-area-inset-${edge}, 0px)`),
                    native,
                    effective: readInsets(edge => `var(--inset-${edge})`)
                };
            }
            function rect(selector) {
                const element = document.querySelector(selector);
                if (!element) return null;
                const {top, bottom, left, right, height} = element.getBoundingClientRect();
                return {top, bottom, left, right, height};
            }
            function snapshot(event, measurements = measure()) {
                const record = {event, documentID, pageMs: performance.now(), ...measurements,
                    rects: {hero: rect(".hero"), kicker: rect(".hero-kicker"), footer: rect("#diagnostics")},
                    viewport: {width: innerWidth, height: innerHeight, scale: visualViewport?.scale ?? null}};
                snapshots.push(record);
                if (snapshots.length > 8) snapshots.shift();
                window.webkit?.messageHandlers?.probe?.postMessage(record);
                return record;
            }
            snapshot("initial");
            requestAnimationFrame(() => snapshot("frame"));
            document.addEventListener("DOMContentLoaded", () => snapshot("dom"));
            window.addEventListener("load", () => snapshot("load"));
            window.addEventListener("pageshow", event => snapshot(event.persisted ? "pageshow-restored" : "pageshow"));
            window.addEventListener("native-safe-area-change", () => snapshot("native-change"));
            window.addEventListener("resize", () => snapshot("resize"));
            let lastSignature;
            function render() {
                const measurements = measure();
                const signature = JSON.stringify(measurements);
                if (signature !== lastSignature) {
                    snapshot("insets-change", measurements);
                    lastSignature = signature;
                    const diagnostics = document.getElementById("diagnostics");
                    if (diagnostics) diagnostics.textContent = snapshots.map(s =>
                        `${s.event} ${s.pageMs.toFixed(1)}ms\nenv ${JSON.stringify(s.env)}\nnative ${JSON.stringify(s.native)}`
                    ).slice(-3).join("\n");
                }
                requestAnimationFrame(render);
            }
            requestAnimationFrame(render);
        </script>
	</head>
	<body>
		<header class="hero">
			<div class="hero-kicker">Below the nav bar</div>
			<div class="hero-title">Full bleed hero</div>
		</header>
		<main id="main">
            <p><button id="reload">Reload</button> <button id="next">Next document</button> <button id="back">Web back</button></p>
        </main>
		<div id="diagnostics"></div>
        <script>
            const main = document.getElementById("main");
            for (let i = 1; i <= 80; i++) {
                const row = document.createElement("div");
                row.className = "row";
                row.textContent = "Row " + i;
                main.appendChild(row);
            }
            document.getElementById("reload").onclick = () => location.reload();
            document.getElementById("next").onclick = () => {
                const url = new URL(location.href);
                url.searchParams.set("visit", Number(url.searchParams.get("visit") || 0) + 1);
                location.href = url.href;
            };
            document.getElementById("back").onclick = () => history.back();
        </script>
	</body>
</html>
